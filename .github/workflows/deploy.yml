name: Deploy — O Futuro da Escrita Acadêmica

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy — ${{ matrix.site_name }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment_name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Site principal ───────────────────────────────────────────────
          - site_name: site-principal
            environment_name: LP_CEIA_RM
            vps_path: /var/www/o-futuro-da-escrita-academica
            restart_compose: true

          # ── Variante 1 ───────────────────────────────────────────────────
          - site_name: variante-1
            environment_name: LP_CEIA_RM_VAR_1
            vps_path: /var/www/variante-1
            restart_compose: false

          # ── Variante 2 ───────────────────────────────────────────────────
          - site_name: variante-2
            environment_name: LP_CEIA_RM_VAR_2
            vps_path: /var/www/variante-2
            restart_compose: false

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci --legacy-peer-deps

      - name: Build de produção (${{ matrix.site_name }})
        run: npm run build
        env:
          VITE_HOTMART_URL:             https://pay.hotmart.com/O104206161Q?off=ozhq6dsd
          VITE_PRICE_FULL:              '147'
          VITE_PRICE_INSTALLMENTS:      '12'
          VITE_PRICE_INSTALLMENT_VALUE: '15,20'

      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 2200 -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Enviar dist/ para a VPS — ${{ matrix.site_name }}
        run: |
          rsync -avz --delete \
            -e "ssh -p 2200 -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            dist/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ matrix.vps_path }}/

      - name: Restartar container (site-principal)
        if: matrix.restart_compose == true
        run: |
          ssh -p 2200 -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "docker compose -f /root/escrita-academica/docker-compose.yml up -d --force-recreate"
